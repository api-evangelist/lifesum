aid: lifesum
name: Lifesum
description: Lifesum is a Stockholm-based digital health company whose consumer mobile
  application helps people improve their well-being through food logging, calorie and
  macronutrient tracking, personalized meal plans, recipes, and habit building. Backed
  by Balderton Capital, the company operates a subscription business-to-consumer product
  across iOS and Android in a dozen languages. As of this profile Lifesum publishes no
  public developer program, API documentation, or partner API portal, so this entry is
  an identity-only company record in the API Evangelist network rather than an API
  profile.
